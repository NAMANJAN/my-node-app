name: New Relic Deployment Marker

on:
  push:
    branches:
      - main  # Trigger on push to main branch

jobs:
  notify-newrelic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Notify New Relic of Deployment
        run: |
          curl -X POST "https://api.newrelic.com/v2/applications/${{ secrets.NEW_RELIC_APP_ID }}/deployments.json" \
          -H "Api-Key: ${{ secrets.NEW_RELIC_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "deployment": {
              "revision": "${{ github.sha }}",
              "changelog": "Deployed via GitHub Actions",
              "description": "New deployment from GitHub Actions",
              "user": "${{ github.actor }}"
            }
          }'
